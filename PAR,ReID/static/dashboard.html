<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카메라 대시보드</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
    padding: 16px;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 16px;
  }
  .cam-card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
  }
  .cam-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid #333;
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.ok { background: #4caf50; }
  .status-dot.bad { background: #f44336; }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .panel {
    max-height: 220px;
    overflow-y: auto;
    padding: 8px 12px;
    font-size: 12px;
  }
  .track-row {
    border-bottom: 1px solid #2a2a2a;
    padding: 6px 0;
  }
  .track-row .id-line {
    display: flex;
    justify-content: space-between;
    color: #9cf;
    margin-bottom: 3px;
  }
  .track-row .par-line {
    color: #fc6;
  }
</style>
</head>
<body>

<h1>카메라 대시보드</h1>
<div class="grid" id="grid"></div>

<script>
const CAMERAS = ["cam1", "cam2", "cam3", "cam4", "cam5"];

// 카메라별 서버 매핑. 지금은 GPU 1개 + 프로세스 1개로 전부 처리하므로 전부 같은 서버(origin)를 가리킴.
// 나중에 멀티 GPU로 다시 나누게 되면 이 값만 카메라별로 다르게 바꾸면 됨.
const CAMERA_SERVERS = {
  cam1: location.origin,
  cam2: location.origin,
  cam3: location.origin,
  cam4: location.origin,
  cam5: location.origin,
};

const grid = document.getElementById("grid");
const trackCache = {}; // camera_id -> latest tracks[]

for (const camId of CAMERAS) {
  const card = document.createElement("div");
  card.className = "cam-card";
  card.innerHTML = `
    <div class="cam-header">
      <span><span class="status-dot bad" id="dot-${camId}"></span>${camId}</span>
      <span id="frameinfo-${camId}">-</span>
    </div>
    <div class="video-wrap">
      <video id="video-${camId}" autoplay playsinline muted></video>
      <canvas id="canvas-${camId}"></canvas>
    </div>
    <div class="panel" id="panel-${camId}"></div>
  `;
  grid.appendChild(card);

  connectWebRTC(camId);
  connectMetadata(camId);
}

async function connectWebRTC(camId) {
  const server = CAMERA_SERVERS[camId];
  const pc = new RTCPeerConnection();
  pc.addTransceiver("video", { direction: "recvonly" });

  const video = document.getElementById(`video-${camId}`);
  pc.ontrack = (event) => {
    video.srcObject = event.streams[0];
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  try {
    const res = await fetch(`${server}/offer/${camId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sdp: offer.sdp, type: offer.type }),
    });
    const answer = await res.json();
    if (answer.error) {
      console.error(camId, answer.error);
      return;
    }
    await pc.setRemoteDescription(answer);
  } catch (e) {
    console.error(`${camId} WebRTC 연결 실패`, e);
    // 5초 후 재시도
    setTimeout(() => connectWebRTC(camId), 5000);
  }
}

function connectMetadata(camId) {
  const server = CAMERA_SERVERS[camId];
  const wsProto = server.startsWith("https") ? "wss" : "ws";
  const wsHost = server.replace(/^https?:\/\//, "");
  const ws = new WebSocket(`${wsProto}://${wsHost}/ws/${camId}`);

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.error) return;

    document.getElementById(`dot-${camId}`).className =
      "status-dot " + (data.connected ? "ok" : "bad");
    document.getElementById(`frameinfo-${camId}`).textContent =
      `frame ${data.frame} · ${data.tracks.length}명`;

    trackCache[camId] = data.tracks;
    drawOverlay(camId, data.tracks);
    renderPanel(camId, data.tracks);
  };

  ws.onclose = () => {
    setTimeout(() => connectMetadata(camId), 3000);
  };
}

function drawOverlay(camId, tracks) {
  const video = document.getElementById(`video-${camId}`);
  const canvas = document.getElementById(`canvas-${camId}`);
  if (!video.videoWidth) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 캔버스가 카메라 원본 해상도로 그려지므로, 화면에 작게 축소 표시돼도
  // 두껍고 크게 보이도록 해상도에 비례해서 굵기/폰트 크기를 키운다.
  const lineWidth = Math.max(3, canvas.width / 300);
  const fontSize = Math.max(20, Math.round(canvas.width / 55));
  const labelHeight = fontSize + 12;

  ctx.lineWidth = lineWidth;
  ctx.font = `bold ${fontSize}px sans-serif`;
  ctx.textBaseline = "middle";

  for (const t of tracks) {
    const [x1, y1, x2, y2] = t.bbox;
    const color = t.is_new_person ? "#4caf50" : "#2196f3";
    ctx.strokeStyle = color;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    const label = `P${t.display_id ?? "?"}${t.trace_id ? " " + t.trace_id.slice(0, 6) : ""}`;
    const textWidth = ctx.measureText(label).width;
    const labelY = y1 - labelHeight >= 0 ? y1 - labelHeight : y1;
    ctx.fillStyle = color;
    ctx.fillRect(x1, labelY, textWidth + fontSize, labelHeight);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, x1 + fontSize / 2, labelY + labelHeight / 2);
  }
}

function renderPanel(camId, tracks) {
  const panel = document.getElementById(`panel-${camId}`);
  if (tracks.length === 0) {
    panel.innerHTML = `<div style="color:#666">탐지된 사람 없음</div>`;
    return;
  }

  panel.innerHTML = tracks.map((t) => {
    const parEntries = Object.entries(t.par || {});
    const parText = parEntries.length
      ? parEntries.map(([k, v]) => `${k}:${v.toFixed(2)}`).join(" ")
      : "-";
    const status = t.is_new_person === true ? "NEW"
      : t.is_new_person === false ? "MATCH" : "?";
    const quality = t.quality_score != null ? t.quality_score.toFixed(2) : "-";
    const matchScore = t.match_score != null ? t.match_score.toFixed(3) : "-";
    const reasonText = t.decision_reason ? `${t.decision_reason} (sim:${matchScore})` : "-";

    return `
      <div class="track-row">
        <div class="id-line">
          <span>P${t.display_id ?? "?"} · ${status} · q:${quality}</span>
          <span>${t.trace_id ? t.trace_id.slice(0, 8) : "-"}</span>
        </div>
        <div class="par-line">${parText}</div>
        <div style="color:#888; font-size:11px; margin-top:2px;">${reasonText}</div>
      </div>
    `;
  }).join("");
}
</script>

</body>
</html>
